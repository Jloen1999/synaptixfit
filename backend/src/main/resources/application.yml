spring:
  application:
    name: synaptixfit-backend
  config:
    # En local carga backend/.env (ignorado por git) si existe. En Docker/Coolify no hay
    # fichero: las variables llegan del entorno.
    import: optional:file:.env[.properties]
  datasource:
    # En Coolify: DB_HOST = uuid del recurso PostgreSQL (hostname interno de la red infra-app-db).
    # DB_VENDOR elige el motor (postgresql por defecto; mysql es el siguiente previsto, ver
    # docs/06-ops/database_portability.md). El driver y el dialecto de Hibernate se deducen de la URL;
    # DB_URL completa, si existe, manda sobre DB_VENDOR/DB_HOST/DB_PORT/DB_DATABASE.
    url: ${DB_URL:jdbc:${DB_VENDOR:postgresql}://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DATABASE:synaptixfit}}
    username: ${DB_USERNAME:synaptixfit}
    password: ${DB_PASSWORD:synaptixfit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # Migraciones por motor: el SQL de esquema (tipos, índices, uuid, arrays) es propio de cada uno.
    locations: classpath:db/migration/${DB_VENDOR:postgresql}
  web:
    # Idioma de la petición (Accept-Language, lo envía la app): solo decide en qué idioma escribe la IA
    # (AiLanguage). Sin cabecera, español.
    locale: es
    locale-resolver: accept-header
  servlet:
    multipart:
      # Hasta 6 MB el archivo se queda en memoria (sin temporal en disco): la matrícula no toca el disco.
      file-size-threshold: 6MB
      max-file-size: 25MB
      max-request-size: 25MB
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

synaptixfit:
  jwt:
    # Mínimo 32 bytes. En local se usa un valor de desarrollo; en producción es obligatorio JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    issuer: ${JWT_ISSUER:synaptixfit}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  google:
    client-ids: ${GOOGLE_CLIENT_IDS:}
  ai:
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    timeout: ${DEEPSEEK_TIMEOUT:120s}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:8192}
  storage:
    endpoint: ${R2_ENDPOINT:https://example.r2.cloudflarestorage.com}
    region: ${R2_REGION:auto}
    bucket: ${R2_BUCKET:synaptixfit}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    public-base-url: ${R2_PUBLIC_BASE_URL:}
    # Subidas y descargas firmadas por el dominio de la app (nginx /storage/ → R2); vacío: directas a R2.
    proxy-base-url: ${R2_PROXY_BASE_URL:}
  # Vídeos e imágenes de los ejercicios por el dominio de la app (nginx /media/ → bucket público); vacío: tal cual.
  media:
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:SynaptixFit <no-reply@notifications.jloenit.dev>}
    app-url: ${APP_PUBLIC_URL:http://localhost:5173}
    # Resumen semanal por correo: domingo de 19 a 23 h (zona del planificador); cada pasada solo manda a
    # quien aún no lo recibió esa semana. «-» lo desactiva.
    weekly-cron: ${WEEKLY_EMAIL_CRON:0 0 19-23 * * SUN}
  # Política de privacidad y condiciones (ADR 0034): quién responde de los datos y a qué correo escribir.
  # Vacíos: los textos públicos dicen «pendiente de indicar». Nunca se escriben en el código.
  legal:
    controller-name: ${LEGAL_CONTROLLER_NAME:}
    contact-email: ${LEGAL_CONTACT_EMAIL:}
  planner:
    # Clases dadas por asistidas solas al terminar (ADR 0029): cada 10 minutos. «-» lo desactiva.
    auto-attend-cron: ${CLASS_AUTO_ATTEND_CRON:0 */10 * * * *}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

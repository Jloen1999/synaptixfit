name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B test -Pintegration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'   # la misma que frontend/Dockerfile (imagen cirruslabs)
          cache: true
      # Los app_<idioma>.arb no se versionan y `flutter pub get` ya genera las traducciones: se unen
      # antes. merge_arb solo usa dart:io, así que corre sin paquetes resueltos.
      - run: |
          echo '{"configVersion":2,"packages":[]}' > "$RUNNER_TEMP/no-packages.json"
          dart --packages="$RUNNER_TEMP/no-packages.json" tool/merge_arb.dart
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  # Solo en master y con los tests en verde: compila las imágenes y las publica en GHCR. El VPS no
  # compila (Flutter es pesado para un servidor compartido): Coolify solo descarga y arranca.
  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/jloen1999
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/synaptixfit-backend:latest
            ${{ env.REGISTRY }}/synaptixfit-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Web
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            API_BASE_URL=${{ vars.PUBLIC_APP_URL || 'https://synaptixfit.jloenit.dev' }}
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID }}
          tags: |
            ${{ env.REGISTRY }}/synaptixfit-web:latest
            ${{ env.REGISTRY }}/synaptixfit-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

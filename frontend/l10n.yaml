# Traducciones. app_es.arb (plantilla) y app_en/fr/pt.arb se GENERAN con `dart run tool/merge_arb.dart`
# a partir de lib/presentation/l10n/parts/app_<idioma>_<modulo>.arb. No editarlos a mano (ADR 0017).
arb-dir: lib/presentation/l10n
template-arb-file: app_es.arb
output-dir: lib/presentation/l10n/gen_l10n
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false

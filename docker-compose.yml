# Entorno local: PostgreSQL + backend.
#   docker compose up -d db          -> solo la base de datos (desarrollo con ./mvnw spring-boot:run)
#   docker compose up -d --build     -> base de datos + backend
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: synaptixfit
      POSTGRES_USER: synaptixfit
      POSTGRES_PASSWORD: synaptixfit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synaptixfit -d synaptixfit"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: synaptixfit
      DB_USERNAME: synaptixfit
      DB_PASSWORD: synaptixfit
    ports:
      - "8080:8080"

volumes:
  pgdata:
